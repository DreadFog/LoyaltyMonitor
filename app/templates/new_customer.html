{% extends "base.html" %}
{% block title %}Register Customer — LoyaltyMonitor{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-7 col-lg-5">

    <div class="d-flex align-items-center mb-3 gap-2">
      <a href="{{ url_for('customer.list_customers') }}" class="btn btn-outline-secondary btn-sm">
        <i class="fas fa-arrow-left"></i>
      </a>
      <h4 class="mb-0"><i class="fas fa-user-plus me-2 text-primary"></i>Register Customer</h4>
    </div>

    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <p class="text-muted small mb-4">
          All fields are optional. A unique QR-code ID is always generated automatically.
        </p>

        <form method="POST" action="{{ url_for('customer.new_customer') }}" novalidate>
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

          <div class="mb-3">
            <label for="first_name" class="form-label fw-semibold">First name</label>
            <input
              type="text"
              id="first_name"
              name="first_name"
              class="form-control"
              placeholder="Maria"
              autocomplete="given-name"
            />
          </div>

          <div class="mb-3">
            <label for="last_name" class="form-label fw-semibold">Last name</label>
            <input
              type="text"
              id="last_name"
              name="last_name"
              class="form-control"
              placeholder="Rossi"
              autocomplete="family-name"
            />
          </div>

          <div class="mb-4">
            <label for="email" class="form-label fw-semibold">Email <span class="text-muted fw-normal">(optional)</span></label>
            <input
              type="email"
              id="email"
              name="email"
              class="form-control"
              placeholder="maria@example.com"
              autocomplete="email"
            />
            <div class="form-text">Used to send wallet pass links or receipts.</div>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg fw-semibold">
              <i class="fas fa-id-card me-2"></i>Create Loyalty Card
            </button>
          </div>
        </form>
      </div>
    </div>

  </div>
</div>
{% endblock %}
