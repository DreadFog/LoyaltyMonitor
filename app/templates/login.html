{% extends "base.html" %}
{% block title %}Login — LoyaltyMonitor{% endblock %}

{% block content %}
<div class="login-wrapper">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5">

        <div class="card login-card shadow border-0">
          <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">
              <div class="login-icon mb-3">
                <i class="fas fa-star-half-stroke fa-3x text-primary"></i>
              </div>
              <h2 class="fw-bold mb-1">LoyaltyMonitor</h2>
              <p class="text-muted small">Sign in to manage your loyalty programme</p>
            </div>

            <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

              <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Username</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0">
                    <i class="fas fa-user text-muted"></i>
                  </span>
                  <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-control border-start-0"
                    placeholder="admin"
                    autocomplete="username"
                    required
                    autofocus
                  />
                </div>
              </div>

              <div class="mb-3">
                <label for="password" class="form-label fw-semibold">Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0">
                    <i class="fas fa-lock text-muted"></i>
                  </span>
                  <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control border-start-0"
                    placeholder="••••••••"
                    autocomplete="current-password"
                    required
                  />
                </div>
              </div>

              <div class="mb-4 form-check">
                <input type="checkbox" class="form-check-input" id="remember" name="remember" />
                <label class="form-check-label text-muted" for="remember">Remember me</label>
              </div>

              <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg fw-semibold">
                  <i class="fas fa-right-to-bracket me-2"></i>Sign In
                </button>
              </div>
            </form>

          </div>
        </div>

      </div>
    </div>
  </div>
</div>
{% endblock %}
